format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: assets/html.css
    toc: true
    toc-depth: 4
    toc-title: "목차"
    toc-float: true
    page-layout: full

    code-fold: false
    code-copy: true
    highlight-style: github

    number-sections: false
    smooth-scroll: true

    grid:
      sidebar-width: 300px
      body-width: 1000px
      margin-width: 280px # toc

    # 사이트 전역 위젯 (한국어 전용 사이트라 language-switch.html은 넣지 않음)
    include-after-body:
      - assets/ai-chat-init.html
      - assets/edu-sims-resize.html
      - assets/key-terms.html

execute:
  freeze: auto          # 코드 실행 결과 캐시 (빠른 빌드)
  echo: true
  eval: false
  warning: false
  message: false
