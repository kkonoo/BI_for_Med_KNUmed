project:
  type: website
  execute-dir: project
  output-dir: _site

  # 렌더 대상을 명시 — 이 목록에 없는 .qmd 는 빌드하지 않음
  render:
    - index.qmd
    - chapters/w01_intro.qmd
    - chapters/w02_rare_disease.qmd
    - chapters/w03_rare_disease_lab.qmd
    - chapters/w04_complex_pgx.qmd
    - chapters/w05_complex_pgx_lab.qmd
    - chapters/w06_cancer.qmd
    - chapters/w07_cancer_lab.qmd
    - chapters/w09_transcriptome.qmd
    - chapters/w10_transcriptome_lab.qmd
    - chapters/w11_singlecell.qmd
    - chapters/w12_singlecell_lab.qmd
    - chapters/w13_microbiome.qmd
    - chapters/w14_microbiome_lab.qmd

  # 실습 데이터를 사이트에 함께 올려 학생이 내려받을 수 있게 함
  resources:
    - data/

lang: ko

